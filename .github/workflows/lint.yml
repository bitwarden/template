name: Lint

# Keep the Prettier and CSpell tooling here in sync with the pre-commit linter
# in .githooks/pre-commit (versions, file globs, and flags) so local commits and
# CI enforce the same rules. Renovate bumps both together via .github/renovate.json.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  format:
    name: Prettier
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Check formatting
        run: npx --yes prettier@3.9.6 --check "**/*.{md,json,json5,yml,yaml}"

  spell:
    name: CSpell
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Check spelling
        run: npx --yes cspell@10.0.1 --no-progress --gitignore "**/*.md"
